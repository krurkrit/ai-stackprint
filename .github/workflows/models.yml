# Model data: every Sunday (and on demand) builds default/models.json from LiteLLM's model_prices_and_context_window.json
# (BerriAI/litellm, MIT) with tools/ModelData, and opens or updates one pull request from bot/models-update when it changed.
# LiteLLM unreachable: retries after 15, 45 and 90 minutes, then fails without a PR (GitHub emails the owner).
# Data that fails the checks (schema, each provider present, at least 80% of the current models, size) fails the run.
name: Model data

on:
  schedule:
    - cron: '0 12 * * 0'   # Sundays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write        # push bot/models-update
  pull-requests: write   # open or update its pull request

concurrency:
  group: models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # One LiteLLM commit for the file, then the file at that commit (recorded in source.commit)
      - name: Download LiteLLM data
        id: litellm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wait in 0 900 2700 5400; do
            if [ "$wait" -gt 0 ]; then echo "LiteLLM not reachable; trying again in $((wait / 60)) minutes"; sleep "$wait"; fi
            sha=$(gh api "repos/BerriAI/litellm/commits?path=model_prices_and_context_window.json&per_page=1" --jq '.[0].sha' 2>/dev/null) || continue
            [ -n "$sha" ] || continue
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/litellm.json" \
                "https://raw.githubusercontent.com/BerriAI/litellm/$sha/model_prices_and_context_window.json"; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::LiteLLM could not be reached after 4 tries"
          exit 1

      - name: Generate default/models.json
        run: |
          dotnet run --project tools/ModelData -c Release -- \
            --litellm "$RUNNER_TEMP/litellm.json" --commit "${{ steps.litellm.outputs.sha }}" \
            --out default/models.json --report "$RUNNER_TEMP/report.md"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.litellm.outputs.sha }}
        run: |
          if git diff --quiet -- default/models.json; then
            echo "No change in the model data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/models-update
          git add default/models.json
          git commit -m "chore: model data from LiteLLM ${SHA:0:7}"
          git push --force origin bot/models-update
          title="chore: model data from LiteLLM ${SHA:0:7}"
          if [ "$(gh pr list --head bot/models-update --state open --json number --jq length)" -gt 0 ]; then
            gh pr edit bot/models-update --title "$title" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head bot/models-update --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
