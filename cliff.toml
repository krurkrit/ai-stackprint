# git-cliff (https://git-cliff.org): release notes from the commits between two v* tags.
# The release workflow runs it for the pushed tag; locally: git cliff --unreleased (what the next release will say).
# Commits follow Conventional Commits (feat:, fix:, perf:, ...). Older plain commits ("Add ...", "Fix ...") are sorted by their first word.

[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}{{ commit.scope }}: {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false   # keep the older plain commits; the parsers below sort them
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The HTML comments only order the groups; striptags removes them from the headings
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(refactor|style|test|build|ci|chore|docs)", skip = true },
  { message = "^revert", group = "<!-- 3 -->Changed" },
  { message = "^Add", group = "<!-- 0 -->New" },
  { message = "^Fix", group = "<!-- 1 -->Fixed" },
  { message = "^(Apply|Clear|Format|Split|Follow|Store|Initial commit)", skip = true },
  { message = ".*", group = "<!-- 3 -->Changed" },
]
